name: macro_kit
description: A development-time macro system for Dart that generates code instantly for fast iteration without build_runner.
version: 0.8.0
version_code: 51
repository: https://github.com/rebaz94/macro_kit
topics:
  - codegen
  - macro
  - builder
  - development
  - tooling

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  meta: ^1.18.0
  analysis_server_plugin: ^0.3.18
  analyzer: ">=13.3.0 <14.0.0"
  analyzer_plugin: ^0.14.12
  source_helper: ^1.3.13
  watcher: ^1.2.1
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  shelf_web_socket: ^3.0.0
  web_socket_channel: ^3.0.3
  http: ^1.6.0
  collection: ^1.19.1
  change_case: ^2.2.0
  path: ^1.9.1
  logging: ^1.3.0
  hashlib: ^2.4.2
  dart_style: ^3.1.3
  yaml: ^3.1.3

dev_dependencies:
  lints: ^6.1.0
  test: ^1.26.3

